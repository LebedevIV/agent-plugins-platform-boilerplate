<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тест loadDefaultPrompts()</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .test-result { margin: 10px 0; padding: 10px; border-radius: 4px; }
        .success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        pre { background: #f8f9fa; padding: 10px; border-radius: 4px; overflow-x: auto; }
    </style>
</head>
<body>
    <h1>🧪 Тест функции loadDefaultPrompts()</h1>
    <div id="test-results"></div>

    <script>
        // Тест для loadDefaultPrompts() функции
        console.log('🧪 Запуск теста loadDefaultPrompts()');

        let testResults = [];

        function addResult(message, isSuccess = true) {
            testResults.push({ message, isSuccess });
            const resultsDiv = document.getElementById('test-results');
            const div = document.createElement('div');
            div.className = `test-result ${isSuccess ? 'success' : 'error'}`;
            div.textContent = message;
            resultsDiv.appendChild(div);
            console.log(message);
        }

        // Имитация chrome.runtime.getURL для тестирования
        if (typeof chrome === 'undefined') {
            window.chrome = {
                runtime: {
                    getURL: function(path) {
                        addResult(`🔗 chrome.runtime.getURL called with: ${path}`);
                        // В тестовом окружении возвращаем путь к локальному файлу
                        return path;
                    }
                }
            };
        }

        // Тестовый manifest для имитации
        const testManifest = {
            "options": {
                "prompts": {
                    "optimized": {
                        "ru": {
                            "type": "text",
                            "default": "Test Russian optimized prompt content...",
                            "label": { "ru": "Оптимизированный промпт (русский)" }
                        },
                        "en": {
                            "type": "text",
                            "default": "Test English optimized prompt content...",
                            "label": { "ru": "Оптимизированный промпт (английский)" }
                        }
                    },
                    "deep": {
                        "ru": {
                            "type": "text",
                            "default": "Test Russian deep analysis prompt content...",
                            "label": { "ru": "Промпт глубокого анализа (русский)" }
                        },
                        "en": {
                            "type": "text",
                            "default": "Test English deep analysis prompt content...",
                            "label": { "ru": "Промпт глубокого анализа (английский)" }
                        }
                    }
                }
            }
        };

        // Mock fetch для возврата тестового manifest
        const originalFetch = window.fetch;
        window.fetch = function(url) {
            addResult(`📡 Mock fetch called with URL: ${url}`);
            return Promise.resolve({
                ok: true,
                json: function() {
                    addResult('📋 Returning mock manifest data');
                    return Promise.resolve(testManifest);
                }
            });
        };

        // Глобальные переменные для теста
        let defaultPrompts = {};

        // Функция из options/index.html (скопированная для теста)
        async function loadDefaultPrompts() {
            addResult('🔍 Starting loadDefaultPrompts()...');

            try {
                const manifestUrl = chrome.runtime.getURL('plugins/ozon-analyzer/manifest.json');
                addResult(`📂 Manifest URL resolved: ${manifestUrl}`);

                const response = await fetch(manifestUrl);

                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }

                const manifest = await response.json();
                addResult('📋 Manifest JSON parsed successfully');

                if (manifest.options && manifest.options.prompts) {
                    defaultPrompts = manifest.options.prompts;
                    addResult(`🤖 Prompts loaded successfully: ${Object.keys(defaultPrompts).length} types`);

                    return true;
                } else {
                    throw new Error('Раздел prompts не найден в manifest.json');
                }

            } catch (error) {
                addResult(`❌ Error loading prompts: ${error.message}`, false);

                // Fallback на встроенные значения промптов
                defaultPrompts = {
                    optimized: {
                        ru: {
                            type: "text",
                            default: "Ты - токсиколог и химик-косметолог с 15-летним опытом...",
                            label: { ru: "Оптимизированный промпт (русский)" }
                        },
                        en: {
                            type: "text",
                            default: "You are a board-certified toxicologist and cosmetic chemist...",
                            label: { ru: "Оптимизированный промпт (английский)" }
                        }
                    },
                    deep: {
                        ru: {
                            type: "text",
                            default: "Длинный текст промпта глубокого анализа на русском...",
                            label: { ru: "Промпт глубокого анализа (русский)" }
                        },
                        en: {
                            type: "text",
                            default: "Long English deep analysis prompt text...",
                            label: { ru: "Промпт глубокого анализа (английский)" }
                        }
                    }
                };

                addResult('✅ Fallback prompts loaded successfully');
                return true;
            }
        }

        // Запуск теста
        async function runTest() {
            addResult('🚀 Starting comprehensive test...');

            const success = await loadDefaultPrompts();

            if (success) {
                addResult('🎉 Main test completed successfully!');

                // Проверка структуры промптов
                if (defaultPrompts.optimized && defaultPrompts.optimized.ru && defaultPrompts.optimized.en) {
                    addResult('✅ Optimized prompts structure is correct');
                } else {
                    addResult('❌ Optimized prompts structure is incorrect', false);
                }

                if (defaultPrompts.deep && defaultPrompts.deep.ru && defaultPrompts.deep.en) {
                    addResult('✅ Deep analysis prompts structure is correct');
                } else {
                    addResult('❌ Deep analysis prompts structure is incorrect', false);
                }

                // Вывод загруженных промптов
                addResult('📊 Final loaded prompts structure:');
                const pre = document.createElement('pre');
                pre.textContent = JSON.stringify(defaultPrompts, null, 2);
                document.getElementById('test-results').appendChild(pre);

            } else {
                addResult('❌ Test failed!', false);
            }

            // Восстановление оригинального fetch
            window.fetch = originalFetch;

            addResult('🏁 Test suite completed');
        }

        // Запуск теста при загрузке
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', runTest);
        } else {
            runTest();
        }
    </script>
</body>
</html>
