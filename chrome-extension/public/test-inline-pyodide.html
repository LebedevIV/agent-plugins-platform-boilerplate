<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pyodide Inline Execution Test</title>
</head>
<body>
    <h1>Pyodide Inline Execution Test</h1>
    <div id="output"></div>
    <button onclick="testInlineExecution()">Test Inline Pyodide Execution</button>

    <script>
        const output = document.getElementById('output');

        function log(message) {
            console.log(message);
            output.textContent += message + '\n';
        }

        // Mock chrome runtime for testing
        if (typeof chrome === 'undefined') {
            window.chrome = { runtime: { getURL: (path) => path } };
        } else {
            // Keep original chrome.runtime.getURL if available
            const originalGetURL = chrome.runtime.getURL;
            chrome.runtime.getURL = (path) => originalGetURL ?
                originalGetURL(path.replace(/^public\//, '')) : path;
        }

        // Import worker manager
        async function testInlineExecution() {
            log('Starting inline Pyodide execution test...');

            try {
                // Import the worker manager
                const { getWorker, getFallbackMode } = await import('./src/background/worker-manager.js');

                log('Worker manager imported successfully');

                // Check if worker is available
                const context = getExecutionContext();
                log(`Execution context: ${context}`);

                // Test worker creation
                const worker = await getWorker();
                log(`Worker creation result: ${worker ? 'Success' : 'Fallback mode'}`);
                log(`Fallback mode: ${getFallbackMode()}`);

                // Test if inlineExecutePython is available
                if (typeof globalThis.inlineExecutePython === 'function') {
                    log('✅ inlineExecutePython function is available');

                    // Test simple Python execution
                    try {
                        const testCode = `
print("Hello from inline Pyodide execution!")
result = 2 + 3
print(f"2 + 3 = {result}")
__import__('sys').stdout.flush()
result
                        `;

                        log('Executing Python code...');
                        const result = await globalThis.inlineExecutePython(testCode);
                        log(`✅ Python execution successful! Result: ${result}`);
                    } catch (pyError) {
                        log(`❌ Python execution failed: ${pyError.message}`);
                        console.error(pyError);
                    }
                } else {
                    log('❌ inlineExecutePython function not available');
                    log('Available global functions:', Object.keys(globalThis).filter(key =>
                        typeof globalThis[key] === 'function' &&
                        (key.includes('pyodide') || key.includes('inline'))
                    ));
                }

            } catch (error) {
                log(`❌ Test failed: ${error.message}`);
                console.error(error);
            }
        }

        // Context detection function
        function getExecutionContext() {
            if (typeof Worker !== 'undefined' &&
                typeof importScripts === 'undefined' &&
                typeof ServiceWorkerGlobalScope === 'undefined') {
                return 'main_thread_with_worker';
            }
            if (typeof createImageBitmap !== 'function' && typeof importScripts !== 'function') {
                return 'service_worker';
            }
            return 'unknown_context';
        }

        // Auto-test on page load if URL has ?autotest
        if (window.location.search.includes('autotest')) {
            setTimeout(testInlineExecution, 1000);
        }
    </script>
</body>
</html>
