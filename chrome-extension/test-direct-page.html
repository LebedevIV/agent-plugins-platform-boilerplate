<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pyodide Direct Test</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .test-container { max-width: 800px; margin: 0 auto; }
        .output { background: #f5f5f5; padding: 15px; border-radius: 5px; margin: 10px 0; }
        .success { color: green; }
        .error { color: red; }
        .info { color: blue; }
        button { padding: 10px 15px; margin: 5px; cursor: pointer; }
        textarea { width: 100%; height: 100px; margin: 10px 0; }
        .description {
            background: #e8f4fd;
            border-left: 4px solid #2196F3;
            padding: 15px;
            margin: 10px 0;
        }
    </style>
</head>
<body>
    <div class="test-container">
        <h1>🧪 Прямой тест Pyodide endpoint</h1>

        <div class="description">
            <h3>Что это тестирует:</h3>
            <ul>
                <li>Отправку сообщения <code>TEST_PYODIDE_DIRECT</code> в background script</li>
                <li>Проверку версии Chrome (≥109 или <109)</li>
                <li>Исполнение Python кода через Pyodide в offscreen document</li>
                <li>Получение результата выполнения</li>
            </ul>
        </div>

        <h2>Python код для тестирования:</h2>
        <textarea id="pythonCode">print("Hello World!")
result = 2 + 3 * 4
print("2 + 3 * 4 =", result)
result</textarea>

        <button id="runTest">▶️ Запустить тест</button>
        <button id="runSimple">🎯 Простой тест</button>
        <button id="clearOutput">🧹 Очистить вывод</button>

        <div id="output"></div>
    </div>

    <script>
        const outputDiv = document.getElementById('output');
        const pythonCodeTextarea = document.getElementById('pythonCode');
        const runTestBtn = document.getElementById('runTest');
        const runSimpleBtn = document.getElementById('runSimple');
        const clearBtn = document.getElementById('clearOutput');

        function log(message, type = 'info') {
            const timestamp = new Date().toLocaleTimeString();
            const div = document.createElement('div');
            div.className = `output ${type}`;
            div.innerHTML = `<strong>${timestamp}:</strong> ${message}`;
            outputDiv.appendChild(div);
            console.log(`[${type.toUpperCase()}] ${message}`);
        }

        async function runPyodideTest(pythonCode, testType = 'custom') {
            try {
                log(`🚀 Запуск ${testType} теста...`);

                if (!chrome || !chrome.runtime) {
                    log('❌ Chrome extension не обнаружена', 'error');
                    return;
                }

                const testMessage = {
                    type: 'TEST_PYODIDE_DIRECT',
                    pythonCode: pythonCode,
                    timestamp: Date.now()
                };

                log('📤 Отправка сообщения background script');
                const response = await chrome.runtime.sendMessage(testMessage);

                log('📥 Получен ответ от background script');
                log(`Версия Chrome: ${response.chromeVersion || 'неизвестна'}`);

                if (response.success) {
                    log('✅ Тест успешно выполнен!', 'success');
                    log(`Результат: ${JSON.stringify(response.result)}`, 'success');
                    log(`Время выполнения: ${Date.now() - testMessage.timestamp}ms`);
                } else {
                    log(`❌ Тест не прошел: ${response.error}`, 'error');

                    if (response.result && response.result.chromeVersion < 109) {
                        log('ℹ️  Версия Chrome < 109 - Pyodide недоступен', 'info');
                        log('💡 Обновите Chrome до версии 109+ для полноценной работы', 'info');
                    }
                }

                log(`Полные детали ответа: ${JSON.stringify(response, null, 2)}`);

            } catch (error) {
                log(`💥 Ошибка коммуникации: ${error.message}`, 'error');
                log('Убедитесь что extension загрузилось правильно', 'error');
            }
        }

        runTestBtn.addEventListener('click', () => {
            const code = pythonCodeTextarea.value;
            runPyodideTest(code, 'пользовательского');
        });

        runSimpleBtn.addEventListener('click', () => {
            const simpleCode = '1 + 2 + 3';
            runPyodideTest(simpleCode, 'простого');
        });

        clearBtn.addEventListener('click', () => {
            outputDiv.innerHTML = '';
            log('🧹 Вывод очищен');
        });

        // Проверка доступности extension
        setTimeout(() => {
            if (typeof chrome !== 'undefined' && chrome.runtime) {
                log('🔧 Chrome extension runtime обнаружена', 'success');
            } else {
                log('🔶 Chrome extension не обнаружена - протестируйте в контексте extension', 'error');
            }
        }, 500);

        log('🎯 Страница готова. Нажмите кнопку для запуска теста.');
    </script>
</body>
</html>
