<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chunk Transmission Race Condition Test</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 8px 32px rgba(31, 38, 135, 0.37);
        }
        h1 {
            text-align: center;
            margin-bottom: 30px;
            font-size: 2.5rem;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        .status-card {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 15px;
            padding: 20px;
            margin: 20px 0;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
        .status-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        .status-title {
            font-size: 1.2rem;
            font-weight: bold;
            margin: 0;
        }
        .chunk-counter {
            background: #4CAF50;
            color: white;
            padding: 5px 15px;
            border-radius: 20px;
            font-weight: bold;
        }
        #test-buttons {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            margin: 30px 0;
        }
        .test-button {
            background: linear-gradient(45deg, #2196F3, #21CBF3);
            color: white;
            border: none;
            padding: 15px 25px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(33, 150, 243, 0.4);
            flex: 1;
            min-width: 200px;
        }
        .test-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(33, 150, 243, 0.6);
        }
        .test-button:active {
            transform: translateY(0);
        }
        #logs {
            background: rgba(0, 0, 0, 0.8);
            border-radius: 10px;
            padding: 20px;
            font-family: 'Courier New', monospace;
            font-size: 0.9rem;
            max-height: 400px;
            overflow-y: auto;
            white-space: pre-wrap;
        }
        .log-entry {
            margin: 5px 0;
            padding: 5px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
        }
        .log-entry:first-child { border-top: none; }
        .log-entry:last-child { border-bottom: none; }
        .log-timestamp { color: #888; font-size: 0.8rem; }
        .log-level-info { color: #64B5F6; }
        .log-level-success { color: #4CAF50; }
        .log-level-warn { color: #FF9800; }
        .log-level-error { color: #F44336; }
        .log-level-debug { color: #9C27B0; }
        .metrics {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin: 30px 0;
        }
        .metric-card {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            padding: 20px;
            text-align: center;
        }
        .metric-value {
            font-size: 2rem;
            font-weight: bold;
            display: block;
            margin-bottom: 5px;
        }
        .metric-label {
            font-size: 0.9rem;
            opacity: 0.8;
        }
        .progress-bar {
            width: 100%;
            height: 20px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            overflow: hidden;
            margin: 10px 0;
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #4CAF50, #8BC34A);
            transition: width 0.3s ease;
            width: 0%;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔧 Race Condition Protection Test Suite</h1>

        <div class="status-card">
            <div class="status-header">
                <h2 class="status-title">Transmission Status</h2>
                <span class="chunk-counter" id="chunk-counter">0 / 40</span>
            </div>
            <div class="progress-bar">
                <div class="progress-fill" id="progress-fill"></div>
            </div>
            <p id="transfer-status">Ready to start testing</p>
        </div>

        <div class="metrics">
            <div class="metric-card">
                <span class="metric-value" id="total-chunks">40</span>
                <span class="metric-label">Expected Chunks</span>
            </div>
            <div class="metric-card">
                <span class="metric-value" id="transferred-size">0 KB</span>
                <span class="metric-label">Transferred Size</span>
            </div>
            <div class="metric-card">
                <span class="metric-value" id="transfer-speed">0 KB/s</span>
                <span class="metric-label">Transfer Speed</span>
            </div>
            <div class="metric-card">
                <span class="metric-value" id="transfer-time">0s</span>
                <span class="metric-label">Elapsed Time</span>
            </div>
        </div>

        <div id="test-buttons">
            <button class="test-button" id="btn-start-test">🚀 Start Large File Test (1.3MB)</button>
            <button class="test-button" id="btn-start-multi-test">🎯 Start Multiple Concurrent Tests</button>
            <button class="test-button" id="btn-stress-test">⚡ Start Stress Test</button>
            <button class="test-button" id="btn-clear-logs">🧹 Clear Logs</button>
        </div>

        <div class="status-card">
            <h2>📋 Test Results & Diagnostics</h2>
            <div id="logs"></div>
        </div>
    </div>

    <script>
        class TestRunner {
            constructor() {
                this.logs = [];
                this.testStartTime = 0;
                this.chunksTransferred = 0;
                this.isTesting = false;
                this.setupEventListeners();
                this.log('info', 'Test Runner initialized', 'Ready to start race condition protection tests');
            }

            setupEventListeners() {
                document.getElementById('btn-start-test').addEventListener('click', () => this.startLargeFileTest());
                document.getElementById('btn-start-multi-test').addEventListener('click', () => this.startMultiTest());
                document.getElementById('btn-stress-test').addEventListener('click', () => this.startStressTest());
                document.getElementById('btn-clear-logs').addEventListener('click', () => this.clearLogs());
            }

            log(level, title, message, data = null) {
                const timestamp = new Date().toLocaleTimeString();
                const logEntry = {
                    timestamp,
                    level,
                    title,
                    message: data ? `${message}: ${JSON.stringify(data)}` : message
                };

                this.logs.push(logEntry);
                this.updateLogDisplay();

                // Console log for debugging
                console.log(`[${timestamp}] ${level.toUpperCase()}: ${title} - ${logEntry.message}`);
            }

            updateLogDisplay() {
                const logsDiv = document.getElementById('logs');
                const recentLogs = this.logs.slice(-20); // Show last 20 logs

                logsDiv.innerHTML = recentLogs.map(log => `
                    <div class="log-entry log-level-${log.level}">
                        <span class="log-timestamp">[${log.timestamp}]</span>
                        <strong>${log.title}</strong>: ${log.message}
                    </div>
                `).join('');

                // Auto-scroll to bottom
                logsDiv.scrollTop = logsDiv.scrollHeight;
            }

            updateProgress(current, total, transferredSize) {
                this.chunksTransferred = current;

                // Update counter
                const counter = document.getElementById('chunk-counter');
                counter.textContent = `${current} / ${total}`;

                // Update progress bar
                const progress = document.getElementById('progress-fill');
                progress.style.width = `${(current / total) * 100}%`;

                // Update metrics
                document.getElementById('transferred-size').textContent = `${transferredSize} KB`;
                document.getElementById('transfer-time').textContent = `${Date.now() - this.testStartTime}ms`;
                document.getElementById('transfer-speed').textContent = `${this.calculateSpeed(transferredSize)} KB/s`;
            }

            calculateSpeed(transferredKB) {
                const elapsedMs = Date.now() - this.testStartTime;
                const elapsedSeconds = elapsedMs / 1000;
                return (elapsedKB / elapsedSeconds).toFixed(1);
            }

            async startLargeFileTest() {
                if (this.isTesting) {
                    this.log('warn', 'Test Already Running', 'Please wait for current test to complete');
                    return;
                }

                this.isTesting = true;
                this.testStartTime = Date.now();
                this.chunksTransferred = 0;

                this.log('info', 'Starting Large File Test', 'Initializing 33+ chunk transfer simulation');

                try {
                    const result = await this.simulateChunkTransmission(40, 1300); // 40 chunks, 1300KB
                    this.log('success', 'Large File Test Completed', result);
                } catch (error) {
                    this.log('error', 'Large File Test Failed', error.message);
                } finally {
                    this.isTesting = false;
                    this.updateProgress(this.chunksTransferred, 40, 1300);
                }
            }

            async startMultiTest() {
                if (this.isTesting) {
                    this.log('warn', 'Test Already Running', 'Please wait for current test to complete');
                    return;
                }

                this.isTesting = true;
                this.testStartTime = Date.now();

                this.log('info', 'Starting Multiple Concurrent Tests', 'Testing race condition handling with parallel transmissions');

                try {
                    // Start 3 concurrent tests with slight delays to create race conditions
                    const promises = [
                        this.simulateChunkTransmission(33, 1080, 100),
                        this.simulateChunkTransmission(33, 1080, 200),
                        this.simulateChunkTransmission(33, 1080, 300)
                    ];

                    const results = await Promise.all(promises);
                    this.log('success', 'Multi-Test Completed', `All ${results.length} concurrent tests completed successfully`);
                } catch (error) {
                    this.log('error', 'Multi-Test Failed', error.message);
                } finally {
                    this.isTesting = false;
                }
            }

            async startStressTest() {
                if (this.isTesting) {
                    this.log('warn', 'Test Already Running', 'Please wait for current test to complete');
                    return;
                }

                this.isTesting = true;
                this.testStartTime = Date.now();

                this.log('info', 'Starting Stress Test', 'High-intensity testing with 5 concurrent large transmissions');

                try {
                    // Start 5 concurrent tests with race condition simulation
                    const promises = Array.from({ length: 5 }, (_, i) =>
                        this.simulateChunkTransmission(40, 1300, i * 150)
                    );

                    const results = await Promise.all(promises);
                    this.log('success', 'Stress Test Completed', `${results.length} concurrent stress tests completed`);
                } catch (error) {
                    this.log('error', 'Stress Test Failed', error.message);
                } finally {
                    this.isTesting = false;
                }
            }

            async simulateChunkTransmission(totalChunks, totalKb, delay = 0) {
                if (delay > 0) {
                    await new Promise(resolve => setTimeout(resolve, delay));
                }

                this.log('debug', 'Simulating Chunk Transmission', `Starting ${totalChunks} chunks, ${totalKb}KB total`);

                // Simulate transfer with potential race conditions
                let successCount = 0;
                let failCount = 0;

                for (let i = 0; i < totalChunks; i++) {
                    try {
                        // Random delay to simulate network conditions
                        const delay = 50 + Math.random() * 150;

                        // Simulate potential race condition (10% chance)
                        if (Math.random() < 0.1) {
                            await new Promise(resolve => setTimeout(resolve, delay * 2)); // Longer delay
                            throw new Error(`Race condition simulated at chunk ${i}`);
                        }

                        await new Promise(resolve => setTimeout(resolve, delay));

                        // Chunk "success"
                        successCount++;
                        this.updateProgress(successCount, totalChunks, (successCount / totalChunks) * totalKb);

                        // Log every 10th chunk
                        if ((i + 1) % 10 === 0 || i === totalChunks - 1) {
                            this.log('debug', 'Chunk Transmission', `Progress: ${i + 1}/${totalChunks} chunks`);
                        }
                    } catch (error) {
                        failCount++;
                        this.log('warn', 'Chunk Transmission Error', `Chunk ${i} failed: ${error.message}`);
                    }
                }

                const successRate = ((successCount / totalChunks) * 100).toFixed(1);
                const duration = Date.now() - this.testStartTime;

                return {
                    totalChunks,
                    successCount,
                    failCount,
                    successRate: `${successRate}%`,
                    duration: `${duration}ms`,
                    transferSpeed: `${(totalKb / (duration / 1000)).toFixed(1)} KB/s`
                };
            }

            clearLogs() {
                this.logs = [];
                this.updateLogDisplay();
                this.log('info', 'Logs Cleared', 'All previous test logs have been cleared');
            }
        }

        // Initialize test runner when page loads
        document.addEventListener('DOMContentLoaded', () => {
            new TestRunner();
        });
    </script>
</body>
</html>
